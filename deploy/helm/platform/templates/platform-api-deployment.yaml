apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-platform-api
  labels:
    app.kubernetes.io/name: platform-api
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.platformApi.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: platform-api
          image: "{{ .Values.image.registry }}/{{ .Values.platformApi.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "platform.fullname" . }}-config
            - secretRef:
                name: {{ include "platform.secretName" . }}
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.platformApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-platform-api
  labels:
    app.kubernetes.io/name: platform-api
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.platformApi.service.port }}
      targetPort: http
