apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-platform-scheduler
  labels:
    app.kubernetes.io/name: platform-scheduler
    {{- include "platform.labels" . | nindent 4 }}
spec:
  # Safe to run more than one replica: a Redis-lease-backed leader election
  # (internal/infrastructure/leaderelection) ensures only one replica runs
  # the reconciliation pass at a time (§22, Phase 7 HA); extra replicas are
  # cheap standbys that take over within one lease TTL if the leader dies.
  replicas: {{ .Values.platformScheduler.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-scheduler
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: platform-scheduler
          image: "{{ .Values.image.registry }}/{{ .Values.platformScheduler.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "platform.fullname" . }}-config
            - secretRef:
                name: {{ include "platform.secretName" . }}
          resources:
            {{- toYaml .Values.platformScheduler.resources | nindent 12 }}
