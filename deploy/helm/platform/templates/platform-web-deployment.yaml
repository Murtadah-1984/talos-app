apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform.fullname" . }}-platform-web
  labels:
    app.kubernetes.io/name: platform-web
    {{- include "platform.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.platformWeb.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-web
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-web
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: platform-web
          image: "{{ .Values.image.registry }}/{{ .Values.platformWeb.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          resources:
            {{- toYaml .Values.platformWeb.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "platform.fullname" . }}-platform-web
  labels:
    app.kubernetes.io/name: platform-web
    {{- include "platform.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: platform-web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.platformWeb.service.port }}
      targetPort: http
