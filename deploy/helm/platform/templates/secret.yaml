{{- if not .Values.secrets.existingSecret }}
# Only rendered when secrets.existingSecret is unset — a production
# deployment should instead point at a Secret managed by Vault/External
# Secrets Operator/Sealed Secrets (§25, ADR-0006) rather than templating raw
# values through `helm install --set`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-secrets
  labels:
    {{- include "platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  PLATFORM_POSTGRES_DSN: {{ .Values.secrets.postgresDSN | quote }}
  PLATFORM_REDIS_ADDR: {{ .Values.secrets.redisAddr | quote }}
  PLATFORM_RABBITMQ_URL: {{ .Values.secrets.rabbitmqURL | quote }}
  PLATFORM_AUTH_DEV_SIGNING_KEY: {{ .Values.secrets.authDevSigningKey | quote }}
  PLATFORM_OIDC_ISSUER: {{ .Values.secrets.oidcIssuer | quote }}
  PLATFORM_OIDC_CLIENT_ID: {{ .Values.secrets.oidcClientID | quote }}
  PLATFORM_GITHUB_WEBHOOK_SECRET: {{ .Values.secrets.githubWebhookSecret | quote }}
{{- end }}
